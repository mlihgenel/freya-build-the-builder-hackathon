[project]
name = "fbb"
version = "0.1.0"
description = "Freya Bank builder: brief(ler) + openapi -> Freya telefon agent'ı (workflow)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "claude-agent-sdk>=0.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
build-agent = "fbb.cli:build_main"
export-agent = "fbb.cli:export_main"
fbb = "fbb.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fbb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP031", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["fbb", "conftest"]

[tool.ruff.lint.per-file-ignores]
# runtime modülleri Freya'da tek snippet olarak birleşir; birbirlerinin fonksiyonlarını import etmeden kullanır
"src/fbb/runtime/*.py" = ["F821"]
